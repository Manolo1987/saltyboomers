name: fetch-stats

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: stats.json holen
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: python3 fetch_stats.py
      - name: Commit wenn geändert
        run: |
          git config user.name "fetch-stats-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && exit 0
          git commit -m "stats: aktualisieren (Actions-Notlösung)"
          # Astana pusht jede Minute; bei Konflikt gewinnt dessen Stand
          git pull --rebase -X ours origin master || { git rebase --abort; exit 0; }
          git push || true
